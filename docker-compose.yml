services:
  postgres:
    image: postgres:16-alpine
    container_name: team2-therapy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: therapy_core_db
      POSTGRES_USER: therapy_user
      POSTGRES_PASSWORD: therapy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapy_user -d therapy_core_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
